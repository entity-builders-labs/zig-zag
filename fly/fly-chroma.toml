# fly.toml app configuration file for zig-zag-chroma
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "zig-zag-chroma"
primary_region = "iad"

[build]
  image = "chromadb/chroma:latest"

[env]
  CHROMA_HOST = "0.0.0.0"
  CHROMA_PORT = "8000"
  PERSIST_DIRECTORY = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/heartbeat"
    protocol = "http"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "chroma_data"
  destination = "/data"

