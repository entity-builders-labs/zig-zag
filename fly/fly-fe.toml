# fly.toml app configuration file for zig-zag-frontend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "zig-zag-frontend"
primary_region = "iad"

[build]
  dockerfile = "../fe/Dockerfile.prod"
  context = ".."
  
  # IMPORTANTE: Los secrets de Fly.io NO están disponibles automáticamente durante el build
  # Tienes dos opciones:
  #
  # Opción 1: Pasar el secret como build arg manualmente (más seguro)
  #   fly deploy --build-arg EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=$(fly secrets list --app zig-zag-frontend | grep EXPO_PUBLIC_GOOGLE_MAPS_API_KEY | cut -d'=' -f2)
  #
  # Opción 2: Usar [env] en este archivo (menos seguro, pero más simple)
  #   Agrega: EXPO_PUBLIC_GOOGLE_MAPS_API_KEY = "tu-key" en la sección [env] abajo
  #   ⚠️ NO versiones este archivo con el secret incluido

[env]
  NODE_ENV = "production"
  # ⚠️ Si usas esta opción, NO versiones este archivo con el secret
  # EXPO_PUBLIC_GOOGLE_MAPS_API_KEY = "tu-api-key-aqui"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

