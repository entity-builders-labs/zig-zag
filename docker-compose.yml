version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    volumes:
      - ./be:/app/be
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
    ports:
      - '19006:19006'
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8081
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=localhost
    volumes:
      - ./fe:/app/fe
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
