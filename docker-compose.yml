# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# Docker Compose gets environment variables from:
# 1. .env file in the project root (if it exists)
# 2. System environment variables
# 3. ${VARIABLE:-default} syntax allows default values
#
# RECOMMENDED STRUCTURE:
# - Development: .env in project root (for docker-compose)
# - Production: .env.prod in project root (for deploy scripts)
#
# USAGE:
# - Development (default): docker-compose up
#   Uses .env file automatically
#
# - Production (local testing): ./scripts/docker-compose.prod.sh up
#   Uses .env.prod file to test production configuration locally
#   Example: ./docker-compose.prod.sh up -d
#            ./docker-compose.prod.sh logs -f backend
#            ./docker-compose.prod.sh down
#
# The deploy scripts (deploy-be.sh, deploy-fe.sh) will:
# 1. First look for .env.prod in project root
# 2. Fallback to be/.env.prod or fe/.env.prod (backward compatibility)
# 3. Last resort: .env (development file)
#
# ============================================================================
# FRONTEND BUILD TARGETS
# ============================================================================
# The frontend service supports different build targets via BUILD_TARGET:
#
# 1. iOS development server (default):
#    docker-compose up frontend
#    - Runs expo start --dev-client --tunnel
#    - Shows QR code for connecting iOS device
#    - Use the dev client app on your iPhone to scan QR and connect
#    - Works from any network (uses tunnel)
#
# 2. Development (with web):
#    BUILD_TARGET=dev docker-compose build frontend
#    BUILD_TARGET=dev docker-compose up frontend
#    - Runs expo start with dev client, web, and tunnel
#    - Full development server with hot reload
#
# 3. Web build with dev client:
#    BUILD_TARGET=web docker-compose build frontend
#    BUILD_TARGET=web docker-compose up frontend
#    - Runs expo start --dev-client --web
#    - Web development server with dev client enabled
# ============================================================================

services:
  # PostgreSQL service - ONLY for local development
  # In production, Supabase is used (configured via DATABASE_URL)
  # To use this service: docker-compose --profile dev up
  postgres:
    profiles:
      - dev
    image: postgres:15-alpine
    container_name: zigzag-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-zigzag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
    container_name: zigzag-backend
    ports:
      - '4000:3000'
    environment:
      - NODE_ENV=${NODE_ENV}
      - TS_NODE_TRANSPILE_ONLY=true
      # Docker detection flag - helps backend detect it's running in Docker
      - DOCKER_CONTAINER=${DOCKER_CONTAINER}
      # Force postgres hostname for Docker network (hardcoded to override .env)
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - CHROMA_URL=${CHROMA_URL}
      - CHROMA_API_KEY=${CHROMA_API_KEY}
      - CHROMA_TENANT=${CHROMA_TENANT}
      - CHROMA_DATABASE=${CHROMA_DATABASE}
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - PORT=${PORT}
      # AI provider flags
      - ENABLE_AI=${ENABLE_AI}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_MODEL=${AI_MODEL}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - STORAGE_PATH=${STORAGE_PATH}
      - AI_CACHE_MODE=${AI_CACHE_MODE}
      - MOCK_MAPS_MODE=${MOCK_MAPS_MODE}
      - ALLOW_API_FALLBACK=${ALLOW_API_FALLBACK}
      - USE_MOCK_MAPS=${USE_MOCK_MAPS}
    volumes:
      - ./be:/app/be
      - /app/node_modules
    depends_on:
      # PostgreSQL is only required in development (profile: dev)
      # In production, Supabase is used (DATABASE_URL)
      # Note: The startup script handles waiting for postgres if needed
      # We don't include postgres in depends_on because it uses the 'dev' profile
      # and would cause errors when running without --profile dev
      ollama:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    command: sh /app/be/scripts/start-dev.sh

  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
      # Build target: ios (default), dev, web, or lan
      # - ios: iOS development server with dev client and tunnel (default)
      # - lan: Development server with dev client using LAN IP (requires REACT_NATIVE_PACKAGER_HOSTNAME)
      # - dev: Development server with dev client, web, and tunnel
      # - web: Web build with dev client enabled
      args:
        BUILD_TARGET: ${BUILD_TARGET:-ios}
    ports:
      - '8082:8082'
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    environment:
      - NODE_ENV=${NODE_ENV}
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}
      - EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}
      - EXPO_PUBLIC_CORS_PROXY_URL=${EXPO_PUBLIC_CORS_PROXY_URL}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL}
      - FAST_REFRESH=${FAST_REFRESH}
      - EXPO_USE_FAST_REFRESH=${EXPO_USE_FAST_REFRESH}
      - AI_CACHE_MODE=${AI_CACHE_MODE}
      # Add these for iOS device access
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Use host LAN IP for device access (set in .env or shell: REACT_NATIVE_PACKAGER_HOSTNAME=192.168.1.5)
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
      - EXPO_NO_DOTENV=1
      # Force Expo to show QR and URLs
      - CI=false
      - EXPO_NO_TELEMETRY=1
      - FORCE_COLOR=1
      - EXPO_NO_DOTENV=1
    volumes:
      - ./fe:/app/fe
      - /app/node_modules
      - /app/fe/node_modules
    depends_on:
      - backend
      - cors-proxy
    networks:
      - app-network
    restart: unless-stopped
    stdin_open: true
    tty: true

  cors-proxy:
    build:
      context: .
      dockerfile: cors-proxy.Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ./cors-proxy.js:/app/cors-proxy.js
    networks:
      - app-network
    restart: unless-stopped
    command: npx nodemon cors-proxy.js

  chroma:
    image: chromadb/chroma:latest
    ports:
      - '8001:8000'
    environment:
      - CHROMA_HOST=${CHROMA_HOST}
      - CHROMA_PORT=${CHROMA_PORT}
      - PERSIST_DIRECTORY=${PERSIST_DIRECTORY}
    volumes:
      - chroma_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', '/bin/bash', '-c', 'cat < /dev/null > /dev/tcp/localhost/8000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: zigzag-ollama
    ports:
      - '11434:11434'
    environment:
      # Set context size for Ollama models (default: 4096, can be increased up to model's training context)
      # For models trained with 131k context, set OLLAMA_NUM_CTX=131072 to utilize full capacity
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-}
      # Control GPU usage: set to 0 to force CPU-only mode (uses less VRAM, more RAM)
      # Set to -1 to use all available GPUs, or a number to use specific GPU count
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-}
      # Force CPU mode if GPU memory is insufficient (set to "1" to enable)
      - OLLAMA_CPU_ONLY=${OLLAMA_CPU_ONLY:-}
      # Limit number of models loaded simultaneously (default: 1, helps reduce memory usage)
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      # Limit parallel requests (default: 1, helps prevent memory spikes)
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # Models to download on startup
      - AI_MODEL=${AI_MODEL:-llama3.2}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-nomic-embed-text}
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/usr/local/bin/ollama-entrypoint.sh:ro
    networks:
      - app-network
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/usr/local/bin/ollama-entrypoint.sh']
    # Memory and resource limits
    # IMPORTANT: These limits must be less than Docker Desktop's total memory allocation
    # To increase Docker Desktop memory: Settings > Resources > Memory
    deploy:
      resources:
        limits:
          # Adjust based on your model size and available memory
          # llama3.2 needs ~2-4GB, llama3.2:1b needs ~1-2GB
          # For larger models (7b+), increase to 8GB-16GB or more
          memory: ${OLLAMA_MEMORY_LIMIT:-4G}
        reservations:
          memory: ${OLLAMA_MEMORY_RESERVATION:-2G}
    # Note: If you get "model requires more system memory" errors:
    # 1. Increase Docker Desktop memory: Settings > Resources > Memory (16GB+ recommended)
    # 2. Use a smaller model: AI_MODEL=llama3.2:1b (instead of llama3.2)
    # 3. Force CPU mode: OLLAMA_CPU_ONLY=1 (uses more RAM but less VRAM)
    # 4. Reduce context size: OLLAMA_NUM_CTX=2048 (instead of 4096 or higher)
    # 5. Increase OLLAMA_MEMORY_LIMIT in your .env file
    healthcheck:
      # Test the HTTP API endpoint to ensure it's actually ready
      # Use ollama list instead of curl (curl not available in container)
      # Note: Healthcheck runs after entrypoint script downloads models
      test: ['CMD-SHELL', 'ollama list > /dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
