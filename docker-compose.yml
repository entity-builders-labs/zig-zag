services:
  postgres:
    image: postgres:15-alpine
    container_name: zigzag-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-zigzag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
    container_name: zigzag-backend
    ports:
      - '4000:3000'
    environment:
      - NODE_ENV=${NODE_ENV}
      - TS_NODE_TRANSPILE_ONLY=true
      # Force postgres hostname for Docker network (hardcoded to override .env)
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - CHROMA_URL=${CHROMA_URL}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - PORT=${PORT}
      # AI provider flags
      - ENABLE_AI=${ENABLE_AI}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_MODEL=${AI_MODEL}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./be:/app/be
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    command: >
      sh -c "
        echo '🚀 Starting backend application...' &&
        echo 'DATABASE_URL from env: $DATABASE_URL' &&
        # Use environment variable if provided (e.g., Supabase), otherwise use local postgres
        if [ -z \"$DATABASE_URL\" ] || [ \"$DATABASE_URL\" = \"\" ]; then
          echo '📦 No DATABASE_URL provided, using local postgres...' &&
          export DATABASE_URL='postgresql://postgres:postgres@postgres:5432/zigzag' &&
          export DIRECT_URL='postgresql://postgres:postgres@postgres:5432/zigzag'
        else
          echo '☁️  Using provided DATABASE_URL (e.g., Supabase)...' &&
          # For Supabase: Direct connection (5432) is NOT IPv4 compatible
          # Use Session Pooler (6543) for IPv4 networks (like Docker)
          # The setup script will handle DIRECT_URL configuration
          if [ -z \"$DIRECT_URL\" ]; then
            echo '📝 DIRECT_URL not set - setup script will configure it'
            echo '   💡 For Supabase: Use Session Pooler (port 6543) for IPv4 compatibility'
          else
            echo '✅ DIRECT_URL provided'
          fi
        fi &&
        # Remove .env files from be directory to prevent Prisma from reading them
        rm -f /app/be/.env /app/.env 2>/dev/null || true &&
        echo 'Using DATABASE_URL: $DATABASE_URL' &&
        cd /app/be &&
        # Run database setup script
        if [ -f \"scripts/setup-db.sh\" ]; then
          sh scripts/setup-db.sh
        else
          echo '⚠️  Setup script not found, running manual setup...' &&
          npx prisma generate &&
          if [ -d \"prisma/migrations\" ] && [ \"$(ls -A prisma/migrations 2>/dev/null)\" ]; then
            echo '📋 Migrations found, applying...' &&
            npx prisma migrate deploy
          else
            echo '⚠️  No migrations found, using db push (development only)...' &&
            npx prisma db push --skip-generate --accept-data-loss || true
          fi
        fi &&
        echo '🚀 Starting application...' &&
        yarn start:dev
      "

  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
    ports:
      - '4001:8081'
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    environment:
      - NODE_ENV=${NODE_ENV}
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}
      - EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}
      - EXPO_PUBLIC_CORS_PROXY_URL=${EXPO_PUBLIC_CORS_PROXY_URL}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL}
      - FAST_REFRESH=${FAST_REFRESH}
      - EXPO_USE_FAST_REFRESH=${EXPO_USE_FAST_REFRESH}
      - WDS_SOCKET_PORT=${WDS_SOCKET_PORT}
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=${EXPO_DEVTOOLS_LISTEN_ADDRESS}
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
    volumes:
      - ./fe:/app/fe
      - /app/node_modules
      - /app/fe/node_modules
    depends_on:
      - backend
      - cors-proxy
    networks:
      - app-network

  cors-proxy:
    build:
      context: .
      dockerfile: cors-proxy.Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ./cors-proxy.js:/app/cors-proxy.js
    networks:
      - app-network
    restart: unless-stopped
    command: npx nodemon cors-proxy.js

  chroma:
    image: chromadb/chroma:latest
    ports:
      - '8001:8000'
    environment:
      - CHROMA_HOST=${CHROMA_HOST}
      - CHROMA_PORT=${CHROMA_PORT}
      - PERSIST_DIRECTORY=${PERSIST_DIRECTORY}
    volumes:
      - chroma_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', '/bin/bash', '-c', 'cat < /dev/null > /dev/tcp/localhost/8000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: zigzag-ollama
    ports:
      - '11434:11434'
    environment:
      # Set context size for Ollama models (default: 4096, can be increased up to model's training context)
      # For models trained with 131k context, set OLLAMA_NUM_CTX=131072 to utilize full capacity
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-}
      # Control GPU usage: set to 0 to force CPU-only mode (uses less VRAM, more RAM)
      # Set to -1 to use all available GPUs, or a number to use specific GPU count
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-}
      # Force CPU mode if GPU memory is insufficient (set to "1" to enable)
      - OLLAMA_CPU_ONLY=${OLLAMA_CPU_ONLY:-}
      # Limit number of models loaded simultaneously (default: 1, helps reduce memory usage)
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      # Limit parallel requests (default: 1, helps prevent memory spikes)
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    # Memory and resource limits
    # IMPORTANT: These limits must be less than Docker Desktop's total memory allocation
    # To increase Docker Desktop memory: Settings > Resources > Memory
    deploy:
      resources:
        limits:
          # Adjust based on your model size and available memory
          # llama3.2:3b needs ~2-4GB, llama3.2:1b needs ~1-2GB
          # For larger models (7b+), increase to 8GB-16GB or more
          memory: ${OLLAMA_MEMORY_LIMIT:-4G}
        reservations:
          memory: ${OLLAMA_MEMORY_RESERVATION:-2G}
    # Note: If you get "model requires more system memory" errors:
    # 1. Increase Docker Desktop memory: Settings > Resources > Memory (16GB+ recommended)
    # 2. Use a smaller model: AI_MODEL=llama3.2:1b (instead of llama3.2:3b)
    # 3. Force CPU mode: OLLAMA_CPU_ONLY=1 (uses more RAM but less VRAM)
    # 4. Reduce context size: OLLAMA_NUM_CTX=2048 (instead of 4096 or higher)
    # 5. Increase OLLAMA_MEMORY_LIMIT in your .env file
    healthcheck:
      # Test the HTTP API endpoint to ensure it's actually ready
      # Use ollama list instead of curl (curl not available in container)
      test: ['CMD-SHELL', 'ollama list > /dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  ollama-init:
    image: ollama/ollama:latest
    container_name: zigzag-ollama-init
    environment:
      - AI_MODEL=${AI_MODEL:-llama3.2:3b}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-nomic-embed-text}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command: >
      "
        echo '⏳ Waiting for Ollama API to be ready...' &&
        until ollama list > /dev/null 2>&1; do
          echo '⏳ Waiting for Ollama API...' &&
          sleep 2
        done &&
        echo '✅ Ollama is ready' &&
        AI_MODEL=$${AI_MODEL:-llama3.2:3b} &&
        EMBEDDINGS_MODEL=$${EMBEDDINGS_MODEL:-nomic-embed-text} &&
        echo \"📥 Pulling AI model: $$AI_MODEL\" &&
        ollama pull $$AI_MODEL &&
        echo \"📥 Pulling embeddings model: $$EMBEDDINGS_MODEL\" &&
        ollama pull $$EMBEDDINGS_MODEL &&
        echo '✅ All models pulled successfully'
      "

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
