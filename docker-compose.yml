version: '3.8'

services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-keyfile:/etc/mongodb-keyfile:ro
      - ./be/mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongodb-keyfile --auth
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
    ports:
      - '4000:3000'
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://root:example@mongodb:27017/zigzag?authSource=admin&replicaSet=rs0
    volumes:
      - ./be:/app/be
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    command: sh /usr/local/bin/wait-for-mongo.sh mongodb npm run start:dev

  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
    ports:
      - '4001:8081'
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:4000
      - EXPO_PUBLIC_API_URL=http://localhost:4000
      - EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=AIzaSyA9nKk8SB6GVvUZmhAhRCLJzT8iNVgZC48
      - EXPO_PUBLIC_CORS_PROXY_URL=http://localhost:8080
      - ./fe:/app/fe
      - /app/node_modules
    depends_on:
      - backend
      - cors-proxy
    networks:
      - app-network

  cors-proxy:
    build:
      context: .
      dockerfile: cors-proxy.Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=development
    volumes:
      - ./cors-proxy.js:/app/cors-proxy.js
    networks:
      - app-network
    restart: unless-stopped
    command: npx nodemon cors-proxy.js

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
