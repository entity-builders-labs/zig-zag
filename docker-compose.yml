# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# Docker Compose gets environment variables from:
# 1. .env file in the project root (if it exists)
# 2. System environment variables
# 3. ${VARIABLE:-default} syntax allows default values
#
# RECOMMENDED STRUCTURE:
# - Development: .env in project root (for docker-compose)
# - Production: .env.prod in project root (for deploy scripts)
#
# USAGE:
# - Development (default): docker-compose up
#   Uses .env file automatically
#
# - Production (local testing): ./scripts/docker-compose.prod.sh up
#   Uses .env.prod file to test production configuration locally
#   Example: ./docker-compose.prod.sh up -d
#            ./docker-compose.prod.sh logs -f backend
#            ./docker-compose.prod.sh down
#
# Production deploys run through GitHub Actions (.github/workflows/cd.yml),
# not from this file locally. ./scripts/docker-compose.prod.sh is only for
# testing the production Docker image on your own machine.
#
# ============================================================================
# FRONTEND BUILD TARGETS
# ============================================================================
# The frontend service supports different build targets via BUILD_TARGET:
#
# 1. iOS development server (default):
#    docker-compose up frontend
#    - Runs expo start --dev-client --tunnel
#    - Shows QR code for connecting iOS device
#    - Use the dev client app on your iPhone to scan QR and connect
#    - Works from any network (uses tunnel)
#
# 2. Development (with web):
#    BUILD_TARGET=dev docker-compose build frontend
#    BUILD_TARGET=dev docker-compose up frontend
#    - Runs expo start with dev client, web, and tunnel
#    - Full development server with hot reload
#
# 3. Web build with dev client:
#    BUILD_TARGET=web docker-compose build frontend
#    BUILD_TARGET=web docker-compose up frontend
#    - Runs expo start --dev-client --web
#    - Web development server with dev client enabled
# ============================================================================

services:
  # PostgreSQL service - ONLY for local development
  # In production, AWS RDS is used (configured via DATABASE_URL)
  # To use this service: docker-compose --profile dev up
  postgres:
    profiles:
      - dev
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: zigzag-postgres-pgvector-postgis:pg15
    container_name: zigzag-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-zigzag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
      # The final stage (`runner`) is a production-only image — its
      # node_modules is installed with `--production`, so it never gets
      # devDependencies like @nestjs/cli. `command:` below overrides it to
      # run `nest start --watch` for local dev, which needs that CLI —
      # `builder` is the earlier stage that still has the full install.
      target: builder
    container_name: zigzag-backend
    ports:
      - '4000:3000'
    env_file:
      - ./.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - TS_NODE_TRANSPILE_ONLY=true
      # Docker detection flag - helps backend detect it's running in Docker
      - DOCKER_CONTAINER=true
      # Force postgres hostname for Docker network (hardcoded to override .env)
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/zigzag}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres:postgres@postgres:5432/zigzag}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - PLACES_PROVIDER=${PLACES_PROVIDER:-google}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - PORT=3000
      # AI provider flags
      - ENABLE_AI=${ENABLE_AI:-true}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - DISCOVERY_EXTRACTOR_PROVIDER=${DISCOVERY_EXTRACTOR_PROVIDER:-groq}
      - GROQ_DISCOVERY_MODEL=${GROQ_DISCOVERY_MODEL:-qwen/qwen3.8-27b}
      - GEMINI_DISCOVERY_MODEL=${GEMINI_DISCOVERY_MODEL:-gemini-2.0-flash}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-nomic-embed-text}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-256}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Ollama is host-managed; Docker Compose does not start an Ollama service.
      # This container -> host default is intentionally different from the
      # localhost URL used by Jest/scripts executed directly on the host.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GROUNDED_SEARCH_PROVIDER=${GROUNDED_SEARCH_PROVIDER:-tavily}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - STORAGE_PATH=${STORAGE_PATH}
      - AI_CACHE_MODE=${AI_CACHE_MODE}
      - MOCK_MAPS_MODE=${MOCK_MAPS_MODE}
      - ALLOW_API_FALLBACK=${ALLOW_API_FALLBACK}
      - USE_MOCK_MAPS=${USE_MOCK_MAPS}
      # The local Overpass profile publishes port 12345 on Docker Desktop's
      # host. Use it by default in development; production can still provide
      # an explicit OVERPASS_API_URL.
      - OVERPASS_API_URL=${OVERPASS_API_URL:-http://host.docker.internal:12345/api/interpreter}
      - OVERPASS_TIMEOUT_MS=${OVERPASS_TIMEOUT_MS}
      - OVERPASS_MAX_RETRIES=${OVERPASS_MAX_RETRIES}
      - OVERPASS_RETRY_BASE_MS=${OVERPASS_RETRY_BASE_MS}
      - OVERPASS_TOTAL_BUDGET_MS=${OVERPASS_TOTAL_BUDGET_MS}
      - OVERPASS_MAX_RADIUS_METERS=${OVERPASS_MAX_RADIUS_METERS}
      - OVERPASS_MAX_CONCURRENCY=${OVERPASS_MAX_CONCURRENCY}
      - NOMINATIM_API_URL=${NOMINATIM_API_URL}
      - NOMINATIM_REVERSE_API_URL=${NOMINATIM_REVERSE_API_URL}
      - NOMINATIM_TIMEOUT_MS=${NOMINATIM_TIMEOUT_MS}
      # Security / API docs
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED}
      # Auth (Google/Apple/email-OTP login)
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - GOOGLE_CLIENT_IDS=${GOOGLE_CLIENT_IDS}
      - APPLE_CLIENT_IDS=${APPLE_CLIENT_IDS:-com.entitiybuilders.zig-zag}
      - ALLOW_DEV_APPLE_AUTH_MOCK=${ALLOW_DEV_APPLE_AUTH_MOCK:-true}
      - EMAIL_OTP_TTL_MINUTES=${EMAIL_OTP_TTL_MINUTES}
      - EMAIL_OTP_MAX_ATTEMPTS=${EMAIL_OTP_MAX_ATTEMPTS}
      - EMAIL_OTP_RESEND_COOLDOWN_SECONDS=${EMAIL_OTP_RESEND_COOLDOWN_SECONDS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - ${BACKEND_DIR:-./be}:/app/be
      - /app/node_modules
      - /app/be/node_modules

    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    command: sh /app/be/scripts/start-dev.sh

  prisma-studio:
    build:
      context: .
      dockerfile: be/Dockerfile
      target: builder
    container_name: zigzag-prisma-studio
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/zigzag
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/zigzag
    volumes:
      - ${BACKEND_DIR:-./be}:/app/be
      - /app/node_modules
      - /app/be/node_modules
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    command: sh -c "cd /app/be && npx prisma studio --port 5555 --browser none --url=postgresql://postgres:postgres@postgres:5432/zigzag"

  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
      # Build target: ios (default), dev, web, or lan
      # - ios: iOS development server with dev client and tunnel (default)
      # - lan: Development server with dev client using LAN IP (requires REACT_NATIVE_PACKAGER_HOSTNAME)
      # - dev: Development server with dev client, web, and tunnel
      # - web: Web build with dev client enabled
      args:
        BUILD_TARGET: ${BUILD_TARGET:-ios}
    ports:
      - '8082:8082'
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    environment:
      - NODE_ENV=${NODE_ENV}
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}
      - EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}
      - EXPO_PUBLIC_CORS_PROXY_URL=${EXPO_PUBLIC_CORS_PROXY_URL}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL}
      - FAST_REFRESH=${FAST_REFRESH}
      - EXPO_USE_FAST_REFRESH=${EXPO_USE_FAST_REFRESH}
      - AI_CACHE_MODE=${AI_CACHE_MODE}
      # Add these for iOS device access
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Use host LAN IP for device access (set in .env or shell: REACT_NATIVE_PACKAGER_HOSTNAME=192.168.1.5)
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
      - EXPO_NO_DOTENV=1
      # Force Expo to show QR and URLs
      - CI=false
      - EXPO_NO_TELEMETRY=1
      - FORCE_COLOR=1
      - EXPO_NO_DOTENV=1
    volumes:
      - ./fe:/app/fe
      - /app/node_modules
      - /app/fe/node_modules
    depends_on:
      - backend
      - cors-proxy
    networks:
      - app-network
    restart: unless-stopped
    stdin_open: true
    tty: true

  cors-proxy:
    build:
      context: .
      dockerfile: cors-proxy.Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ./cors-proxy.js:/app/cors-proxy.js
    networks:
      - app-network
    restart: unless-stopped
    command: npx nodemon cors-proxy.js

  # Opt-in local Overpass instance for reproducible OSM composite tests.
  # It imports only Argentina (~407 MB compressed source), never the planet, and
  # keeps the indexed database in a named volume. The initial import exits
  # once; restart: unless-stopped then starts the serving/update process.
  # See docs/development/local-overpass.md before enabling this profile.
  overpass:
    profiles:
      - osm-local
    image: wiktorn/overpass-api:v0.7.62.9@sha256:24452bbe5a82562b0df04beffeca97b7ce3b41ce2b5d30e6839fe705a67b1e6f
    container_name: zigzag-overpass-argentina
    entrypoint:
      - /bin/sh
      - -c
      - chmod 0755 /db && exec /app/docker-entrypoint.sh
    ports:
      - '12345:80'
    environment:
      - OVERPASS_MODE=init
      - OVERPASS_META=no
      - OVERPASS_PLANET_URL=https://download.geofabrik.de/south-america/argentina-latest.osm.pbf
      - OVERPASS_DIFF_URL=https://download.geofabrik.de/south-america/argentina-updates/
      - OVERPASS_PLANET_PREPROCESS=mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf
      - OVERPASS_COMPRESSION=gz
      # Required by map_to_area queries used for city/neighborhood traversal.
      - OVERPASS_USE_AREAS=true
      - OVERPASS_RULES_LOAD=10
      - OVERPASS_UPDATE_SLEEP=3600
      - OVERPASS_MAX_TIMEOUT=60
      - OVERPASS_RATE_LIMIT=2
    volumes:
      - overpass_argentina_data:/db
    networks:
      - app-network
    restart: unless-stopped

  # Opt-in local Nominatim instance, same `osm-local` profile as `overpass`
  # above so `docker compose --profile osm-local up -d` brings up BOTH from
  # the same Argentina Geofabrik source (reproducible search/reverse
  # geocoding to go with the local Overpass streets/boundaries index). See
  # docs/development/local-nominatim.md before enabling this profile — in
  # particular for why this container's snapshot date can genuinely differ
  # from `overpass`'s (Geofabrik's `-latest` URL is a moving pointer and
  # `overpass` does not retain the exact PBF it originally imported), and
  # why UPDATE_MODE is deliberately left at its default `none` here (no
  # replication) so the imported snapshot stays frozen for spike
  # reproducibility, unlike `overpass`'s own hourly diff-apply above.
  #
  # First run downloads + imports the Argentina extract (same PBF as
  # `overpass`, several GB once indexed) into the named volume below; this
  # can take a long time depending on hardware. Subsequent restarts reuse
  # that volume and skip re-import entirely (the image's own entrypoint
  # detects an already-initialized Postgres data directory at
  # `/var/lib/postgresql/16/main`).
  nominatim:
    profiles:
      - osm-local
    image: mediagis/nominatim:5.3@sha256:7923a8e67197fc6d4f4ecb7c0e8bbedffeddcfdf4519596fe946e46a28f5a9f8
    container_name: zigzag-nominatim-argentina
    shm_size: ${NOMINATIM_SHM_SIZE:-1g}
    ports:
      - '8088:8080'
    environment:
      - PBF_URL=https://download.geofabrik.de/south-america/argentina-latest.osm.pbf
      # No REPLICATION_URL/UPDATE_MODE on purpose -- see the block comment
      # above. FREEZE saves disk once the one-time import is done (this
      # container never needs to accept updates for a spike snapshot).
      - FREEZE=true
      # Skips the Wikipedia importance-ranking dump: faster first import,
      # and result RANKING quality isn't what B5's resolver depends on --
      # it only needs a correct osm_type/osm_id/geometry match, not
      # `importance`-based tie-breaking against unrelated candidates
      # (destination-scoped `countrycodes` already does that narrowing).
      - IMPORT_WIKIPEDIA=false
      - THREADS=${NOMINATIM_IMPORT_THREADS:-}
      - NOMINATIM_PASSWORD=${NOMINATIM_PASSWORD:-zigzag_spike_dev_only}
    volumes:
      - nominatim_argentina_data:/var/lib/postgresql/16/main
      - nominatim_argentina_flatnode:/nominatim/flatnode
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      # Nominatim's own readiness endpoint (returns "OK" once the API is up
      # AND the import has completed) -- see
      # https://nominatim.org/release-docs/latest/api/Status/. A long
      # start_period because first-time import (download + osm2pgsql +
      # indexing) can take well over an hour; this only affects `depends_on:
      # condition: service_healthy` waiters, not the container's own import
      # progress.
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080/status || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2h
    deploy:
      resources:
        limits:
          memory: ${NOMINATIM_MEMORY_LIMIT:-4G}
        reservations:
          memory: ${NOMINATIM_MEMORY_RESERVATION:-2G}

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  overpass_argentina_data:
  nominatim_argentina_data:
  nominatim_argentina_flatnode:
