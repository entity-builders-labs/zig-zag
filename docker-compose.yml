services:
  postgres:
    image: postgres:15-alpine
    container_name: zigzag-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-zigzag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
    container_name: zigzag-backend
    ports:
      - '4000:3000'
    environment:
      - NODE_ENV=${NODE_ENV}
      - TS_NODE_TRANSPILE_ONLY=true
      # Force postgres hostname for Docker network (hardcoded to override .env)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/zigzag
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/zigzag
      - CHROMA_URL=${CHROMA_URL}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT}
      - PORT=${PORT}
      # AI provider flags
      - ENABLE_AI=${ENABLE_AI}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_MODEL=${AI_MODEL}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./be:/app/be
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Starting backend application...' &&
        echo 'DATABASE_URL from env: $DATABASE_URL' &&
        # Export to ensure it's available, then unset any .env interference
        export DATABASE_URL='postgresql://postgres:postgres@postgres:5432/zigzag' &&
        export DIRECT_URL='postgresql://postgres:postgres@postgres:5432/zigzag' &&
        # Remove .env files from be directory to prevent Prisma from reading them
        rm -f /app/be/.env /app/.env 2>/dev/null || true &&
        echo 'Using DATABASE_URL: $DATABASE_URL' &&
        cd /app/be &&
        echo 'Generating Prisma Client...' &&
        npx prisma generate &&
        echo 'Syncing database schema (development mode)...' &&
        if [ -d "prisma/migrations" ] && [ "$(ls -A prisma/migrations 2>/dev/null)" ]; then
          echo 'Migrations found, applying...' &&
          npx prisma migrate deploy
        else
          echo 'No migrations found, using db push (development only)...' &&
          npx prisma db push --skip-generate --accept-data-loss || true
        fi &&
        echo 'Starting application...' &&
        yarn start:dev
      "

  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
    ports:
      - '4001:8081'
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    environment:
      - NODE_ENV=${NODE_ENV}
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}
      - EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}
      - EXPO_PUBLIC_CORS_PROXY_URL=${EXPO_PUBLIC_CORS_PROXY_URL}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL}
      - FAST_REFRESH=${FAST_REFRESH}
      - EXPO_USE_FAST_REFRESH=${EXPO_USE_FAST_REFRESH}
      - WDS_SOCKET_PORT=${WDS_SOCKET_PORT}
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=${EXPO_DEVTOOLS_LISTEN_ADDRESS}
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
    volumes:
      - ./fe:/app/fe
      - /app/node_modules
      - /app/fe/node_modules
    depends_on:
      - backend
      - cors-proxy
    networks:
      - app-network

  cors-proxy:
    build:
      context: .
      dockerfile: cors-proxy.Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=${NODE_ENV}
    volumes:
      - ./cors-proxy.js:/app/cors-proxy.js
    networks:
      - app-network
    restart: unless-stopped
    command: npx nodemon cors-proxy.js

  chroma:
    image: chromadb/chroma:latest
    ports:
      - '8001:8000'
    environment:
      - CHROMA_HOST=${CHROMA_HOST}
      - CHROMA_PORT=${CHROMA_PORT}
      - PERSIST_DIRECTORY=${PERSIST_DIRECTORY}
    volumes:
      - chroma_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', '/bin/bash', '-c', 'cat < /dev/null > /dev/tcp/localhost/8000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
