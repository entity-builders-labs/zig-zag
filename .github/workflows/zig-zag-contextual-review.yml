name: Zig-Zag Contextual Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review at its current head
        required: true
        type: string

concurrency:
  group: zig-zag-contextual-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR_NUMBER:-$DISPATCH_PR_NUMBER}"
          pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r .head.ref <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "head_repo=$(jq -r .head.repo.full_name <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .base.ref <<<"$pr")" >> "$GITHUB_OUTPUT"

  untrusted-pr:
    needs: resolve-pr
    if: needs.resolve-pr.outputs.head_repo != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Contextual review skipped: PR head repository is not entity-builders-labs/zig-zag."
          echo "No OPENAI_API_KEY is exposed to untrusted fork code."

  review:
    needs: resolve-pr
    if: needs.resolve-pr.outputs.head_repo == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the exact public track branch without persisted credentials
        env:
          HEAD_REF: ${{ needs.resolve-pr.outputs.head_ref }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout --force -B "$HEAD_REF" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - id: track
        name: Reconstruct canonical track context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          BASE_REF: ${{ needs.resolve-pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          context="$(scripts/agent-track context)"
          printf '%s\n' "$context"
          track="$(sed -n 's/^Track: //p' <<<"$context")"
          test -n "$track"
          integration="$(sed -n 's/^Integration target: //p' <<<"$context")"
          test "$integration" = "$BASE_REF"
          merge_base="$(git merge-base HEAD "origin/$BASE_REF")"
          pr_metadata="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq '{title, url, draft, state, head: .head.sha, base: .base.ref}')"
          check_evidence="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" 2>/dev/null | jq '[.check_runs[] | {name, status, conclusion}]' || printf '%s' '"UNAVAILABLE"')"
          cat > .github/codex/track-review-input.md <<EOF
          # Runtime review input

          track=$track
          pr_number=$PR_NUMBER
          reviewed_head=$HEAD_SHA
          base_branch=$BASE_REF
          integration_diff=git diff --find-renames --find-copies "$merge_base"..."$HEAD_SHA"

          ## PR metadata
          $pr_metadata

          ## Available check evidence at review start
          $check_evidence
          EOF
          echo "track=$track" >> "$GITHUB_OUTPUT"
      - id: existing
        name: Avoid duplicate review for the same head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          TRACK: ${{ steps.track.outputs.track }}
        run: |
          set -euo pipefail
          reviews="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews")"
          if jq -e --arg sha "$HEAD_SHA" --arg track "$TRACK" \
            '.[] | select(.body | contains("<!-- zig-zag-contextual-review\ntrack=" + $track + "\nreviewed_head=" + $sha + "\n-->"))' \
            <<<"$reviews" >/dev/null; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report already-current review
        if: steps.existing.outputs.current == 'true'
        run: echo "A contextual review is already anchored to this exact PR head."
      - name: Require OpenAI configuration
        if: steps.existing.outputs.current != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "REVIEW UNAVAILABLE / FAILED: configure repository secret OPENAI_API_KEY." >&2
            exit 1
          fi
      - id: codex
        if: steps.existing.outputs.current != 'true'
        # openai/codex-action v1
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/track-review-prompt.md
          output-file: .github/codex/track-review-output.json
          output-schema-file: .github/codex/track-review-schema.json
          permission-profile: :read-only
          safety-strategy: read-only
      - name: Validate structured review output
        if: steps.existing.outputs.current != 'true'
        env:
          TRACK: ${{ steps.track.outputs.track }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          BASE_REF: ${{ needs.resolve-pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          jq -e --arg track "$TRACK" --arg head "$HEAD_SHA" --arg base "$BASE_REF" \
            --argjson pr "$PR_NUMBER" '
              .track == $track and .pr_number == $pr and .reviewed_head == $head and
              .base_branch == $base and (.findings | type == "array") and
              (.code_review_verdict == "PASS" or .code_review_verdict == "CHANGES_REQUIRED") and
              (.architecture_verdict == "ARCHITECTURE_PASS" or .architecture_verdict == "ARCHITECTURE_DRIFT_WARNING")
            ' .github/codex/track-review-output.json >/dev/null
      - name: Publish contextual review
        if: steps.existing.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ steps.track.outputs.track }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          BASE_REF: ${{ needs.resolve-pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' '<!-- zig-zag-contextual-review'
            printf 'track=%s\nreviewed_head=%s\n-->\n\n' "$TRACK" "$HEAD_SHA"
            printf '# Contextual Agent Review\n\nTrack: %s\nReviewed HEAD: %s\nBase: %s\n\n' "$TRACK" "$HEAD_SHA" "$BASE_REF"
            jq -r '"CODE REVIEW: " + (.code_review_verdict | if . == "CHANGES_REQUIRED" then "CHANGES REQUIRED" else . end), .architecture_verdict, "", "Findings:"' .github/codex/track-review-output.json
            jq -r 'if length == 0 then "- None." else .[] | "- [\(.severity)] \(.id): \(.title) (\(.file)\(if .line then ":" + .line else "" end))\n  Reason: \(.reason)\n  Required fix: \(.required_fix)" end' .github/codex/track-review-output.json
            printf '\nVerification:\n'
            jq -r .verification_summary .github/codex/track-review-output.json
          } > .github/codex/track-review-body.md
          gh pr review "$PR_NUMBER" --comment --body-file .github/codex/track-review-body.md
