name: V2 CP11 Runtime Patch

# One-shot recovery workflow. Triggered on this file only; remove after CP11 is persisted.
on:
  push:
    branches:
      - feat/experience-domain-v2
    paths:
      - .github/workflows/v2-cp11-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experience-domain-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn workspace backend prisma:generate
      - run: python .github/scripts/cp11_patch.py
      - run: yarn workspace backend lint
      - run: yarn workspace backend typecheck
      - run: yarn workspace backend test --runInBand generation-trace-v3.util.spec.ts generation-trace-builder.util.spec.ts trace-redaction.util.spec.ts
      - name: Commit CP11 runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be/src/modules/tours/services/experience-generation.service.ts be/src/modules/tours/utils/generation-trace-builder.util.ts be/test/experience-selection-scale.e2e-spec.ts
          git add -u be/src/modules/tours/utils
          if git diff --cached --quiet; then
            echo "No CP11 runtime changes to persist."
          else
            git commit -m "feat(v3): persist auditable generation trace"
            git push origin HEAD:feat/experience-domain-v2
          fi
