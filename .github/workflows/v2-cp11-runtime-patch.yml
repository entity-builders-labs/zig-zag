name: V2 CP11 Runtime Patch

# One-shot recovery workflow. Remove after CP11/CP12 fixes are persisted and normal CI is green.
on:
  push:
    branches:
      - feat/experience-domain-v2
    paths:
      - .github/workflows/v2-cp11-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experience-domain-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: python .github/scripts/cp12_schema_patch.py
      - run: python .github/scripts/cp11_patch.py
      - run: yarn workspace backend prisma:generate
      - run: yarn workspace backend lint
      - run: yarn workspace backend typecheck
      - run: yarn workspace backend test --runInBand generation-trace-v3.util.spec.ts generation-trace-builder.util.spec.ts trace-redaction.util.spec.ts day-trip-feasibility.util.spec.ts
      - name: Commit CP11/CP12 runtime fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be/prisma/schema.prisma be/prisma/migrations/20260903004500_add_catalog_population_job/migration.sql
          git add be/src/modules/tours/services/experience-generation.service.ts be/src/modules/tours/utils/generation-trace-builder.util.ts be/test/experience-selection-scale.e2e-spec.ts
          git add -u be/src/modules/tours/utils
          if git diff --cached --quiet; then
            echo "No CP11/CP12 runtime changes to persist."
            exit 0
          fi
          git commit -m "fix(v2): persist CP11 trace and CP12 catalog job schema"
          git fetch origin feat/experience-domain-v2
          git rebase origin/feat/experience-domain-v2
          yarn workspace backend prisma:generate
          yarn workspace backend lint
          yarn workspace backend typecheck
          yarn workspace backend test --runInBand generation-trace-v3.util.spec.ts generation-trace-builder.util.spec.ts trace-redaction.util.spec.ts day-trip-feasibility.util.spec.ts
          git push origin HEAD:feat/experience-domain-v2
