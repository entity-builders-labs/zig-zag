name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: zig-zag

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and push commit-addressed backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: be/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}/backend:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Read public deployment configuration
        run: |
          # A single batch call instead of 5 separate `get-parameter`s whose
          # failures used to be swallowed: `echo "X=$(cmd_that_fails)"`
          # doesn't trip `set -e` (only the enclosing `echo`'s own exit code
          # does), so a failed lookup silently produced "X=" and the real
          # error only surfaced later as a confusing downstream failure
          # (e.g. `aws s3 sync` against an empty bucket name).
          result=$(aws ssm get-parameters \
            --names /zig-zag/prod/infra/frontend_bucket /zig-zag/prod/infra/frontend_distribution_id \
              /zig-zag/prod/infra/frontend_url /zig-zag/prod/infra/api_url /zig-zag/prod/infra/backend_listener_rule_arn \
            --output json)

          missing=$(echo "$result" | jq -r '.InvalidParameters[]?')
          if [ -n "$missing" ]; then
            echo "Missing SSM parameters: $missing" >&2
            exit 1
          fi

          get_value() {
            echo "$result" | jq -r --arg n "$1" '.Parameters[] | select(.Name==$n) | .Value'
          }

          FRONTEND_BUCKET=$(get_value /zig-zag/prod/infra/frontend_bucket)
          FRONTEND_DISTRIBUTION_ID=$(get_value /zig-zag/prod/infra/frontend_distribution_id)
          FRONTEND_URL=$(get_value /zig-zag/prod/infra/frontend_url)
          API_URL=$(get_value /zig-zag/prod/infra/api_url)
          BACKEND_LISTENER_RULE_ARN=$(get_value /zig-zag/prod/infra/backend_listener_rule_arn)

          for var in FRONTEND_BUCKET FRONTEND_DISTRIBUTION_ID FRONTEND_URL API_URL BACKEND_LISTENER_RULE_ARN; do
            if [ -z "${!var}" ]; then
              echo "ERROR: $var resolved to an empty value" >&2
              exit 1
            fi
            echo "$var=${!var}" >> "$GITHUB_ENV"
          done
      - name: Build frontend
        run: EXPO_PUBLIC_API_URL="$API_URL" yarn workspace fe build:web
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          EXPO_PUBLIC_PLACES_PROVIDER: geoapify
          EXPO_PUBLIC_DIRECTIONS_PROVIDER: geoapify
      - name: Publish frontend
        run: |
          aws s3 sync fe/dist/ "s3://$FRONTEND_BUCKET" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp fe/dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "no-cache,no-store,must-revalidate" --content-type text/html
          aws cloudfront create-invalidation --distribution-id "$FRONTEND_DISTRIBUTION_ID" --paths "/*" >/dev/null
      - name: Start development infrastructure
        run: make aws-start
      - name: Canary deploy backend
        env:
          BACKEND_LISTENER_RULE_ARN: ${{ env.BACKEND_LISTENER_RULE_ARN }}
        run: |
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          scripts/canary-deploy.sh deploy "sha-$DEPLOY_SHA"
      - name: Smoke test
        run: |
          for _ in {1..60}; do
            if curl --fail --silent "$API_URL/health" >/dev/null; then exit 0; fi
            sleep 10
          done
          exit 1
