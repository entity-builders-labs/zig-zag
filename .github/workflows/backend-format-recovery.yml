name: Backend Format Recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace backend prisma:generate
      - name: Apply autofixable backend lint rules
        run: yarn workspace backend lint || true
      - name: Archive formatted backend TypeScript
        uses: actions/upload-artifact@v4
        with:
          name: backend-formatted-sources
          path: |
            be/src/**/*.ts
            be/test/**/*.ts
          retention-days: 1
      - name: Show remaining non-autofixable lint errors
        run: yarn workspace backend lint:check
