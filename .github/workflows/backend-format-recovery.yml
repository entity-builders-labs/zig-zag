name: Experience V3 Recovery Batch

# One-shot CP11 application; delete after the runtime/e2e commit is persisted.
on:
  push:
    paths:
      - '.github/workflows/backend-format-recovery.yml'

permissions:
  contents: write

jobs:
  apply-v3-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experience-domain-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace backend prisma:generate
      - run: python .github/scripts/cp11_patch.py
      - run: yarn workspace backend lint --fix
      - run: yarn workspace backend typecheck
      - run: yarn workspace backend test --runInBand
      - name: Persist V3 recovery batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add be/src be/test
          if git diff --cached --quiet; then
            echo 'No CP11 changes to persist.'
          else
            git commit -m 'feat(v3): persist auditable generation trace and determinism gate'
            git push origin HEAD:feat/experience-domain-v2
          fi
