name: Apply geographic trace integration patch

on:
  push:
    branches:
      - feat/geographic-validation-outbox-media-hardening
    paths:
      - .github/workflows/zz-patch-geographic-trace.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/geographic-validation-outbox-media-hardening
          fetch-depth: 0

      - name: Patch tour activity generation trace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('be/src/modules/tours/services/tour-activity-generation.service.ts')
          text = path.read_text()

          old_import = '''  buildEntityResolutionStep,\n  buildTourIntentStep,'''
          new_import = '''  buildEntityResolutionStep,\n  buildGeographicValidationStep,\n  buildCatalogMaterializationStep,\n  buildTourIntentStep,'''
          if old_import not in text:
              raise SystemExit('expected trace-builder import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_call = '''                      traceSteps.push(\n                        buildEntityResolutionStep(resolutionResult),\n                      );'''
          new_call = '''                      traceSteps.push(\n                        buildEntityResolutionStep(resolutionResult),\n                        buildGeographicValidationStep(resolutionResult),\n                        buildCatalogMaterializationStep(resolutionResult),\n                      );'''
          count = text.count(old_call)
          if count != 1:
              raise SystemExit(f'expected first trace call once, found {count}')
          text = text.replace(old_call, new_call, 1)

          old_second = '''              traceSteps.push(buildEntityResolutionStep(resolutionResult));'''
          new_second = '''              traceSteps.push(\n                buildEntityResolutionStep(resolutionResult),\n                buildGeographicValidationStep(resolutionResult),\n                buildCatalogMaterializationStep(resolutionResult),\n              );'''
          count = text.count(old_second)
          if count != 1:
              raise SystemExit(f'expected second trace call once, found {count}')
          text = text.replace(old_second, new_second, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-patch-geographic-trace.yml
          git add be/src/modules/tours/services/tour-activity-generation.service.ts
          git commit -m "feat(trace): record geographic validation pipeline stages"
          git push origin HEAD:feat/geographic-validation-outbox-media-hardening
