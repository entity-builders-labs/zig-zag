name: Move Closed Issue to Done in Project

on:
  issues:
    types: [closed]
  push:
    branches:
      - main

jobs:
  move-to-done:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'closed'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Get Project Data
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_PAT }} # Requires a PAT with 'project' scope
          USER: juanobrach
          PROJECT_NUMBER: 1 # UPDATE THIS with your Project Number
        run: |
          gh api graphql -f query='
            query($user: String!, $number: Int!) {
              user(login: $user) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2Field {
                        id
                        name
                      }
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f user=$USER -F number=$PROJECT_NUMBER > project_data.json

      - name: Move Issue to Done
        uses: actions/github-script@v6
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }} # Requires a PAT with 'project' scope
          USER: juanobrach
          PROJECT_NUMBER: 1 # UPDATE THIS with your Project Number
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const fs = require('fs');
            const projectData = JSON.parse(fs.readFileSync('project_data.json', 'utf8'));
            const project = projectData.data.user.projectV2;
            const projectId = project.id;

            // Find the "Status" field
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            if (!statusField) {
              console.log('Status field not found');
              return;
            }

            // Find the "Done" option
            const doneOption = statusField.options.find(o => o.name === 'Done');
            if (!doneOption) {
               console.log('Done option not found in Status field');
               return;
            }

            // Get the Issue Node ID
            const issueNodeId = context.payload.issue.node_id;

            // 1. Find the item in the project associated with this issue
            // We might need to add it first if it's not there, but usually it is.
            // This query finds the project item ID for the issue
            const issueQuery = `
              query($id: ID!) {
                node(id: $id) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                        }
                      }
                    }
                  }
                }
              }
            `;

            const issueData = await github.graphql(issueQuery, { id: issueNodeId });
            const projectItem = issueData.node.projectItems.nodes.find(item => item.project.id === projectId);

            let itemId;

            if (!projectItem) {
              console.log('Issue is not in the project. Adding it...');
              const addQuery = `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item {
                      id
                    }
                  }
                }
              `;
              const addData = await github.graphql(addQuery, { projectId: projectId, contentId: issueNodeId });
              itemId = addData.addProjectV2ItemById.item.id;
            } else {
              itemId = projectItem.id;
            }

            // 2. Update the status to Done
            console.log(`Updating item ${itemId} to status Done`);
            const updateQuery = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $value }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(updateQuery, {
              projectId: projectId,
              itemId: itemId,
              fieldId: statusField.id,
              value: doneOption.id
            });

  close-issue-from-commit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
      contents: read
      repository-projects: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Project Data
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_PAT }}
          USER: juanobrach
          PROJECT_NUMBER: 1
        run: |
          gh api graphql -f query='
            query($user: String!, $number: Int!) {
              user(login: $user) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2Field {
                        id
                        name
                      }
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f user=$USER -F number=$PROJECT_NUMBER > project_data.json

      - name: Close Issues from Commits and Move to Done
        uses: actions/github-script@v6
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          USER: juanobrach
          PROJECT_NUMBER: 1
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const fs = require('fs');
            const projectData = JSON.parse(fs.readFileSync('project_data.json', 'utf8'));
            const project = projectData.data.user.projectV2;
            const projectId = project.id;

            // Find the "Status" field
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            if (!statusField) {
              console.log('Status field not found');
              return;
            }

            // Find the "Done" option
            const doneOption = statusField.options.find(o => o.name === 'Done');
            if (!doneOption) {
              console.log('Done option not found in Status field');
              return;
            }

            // Get commits from the push event
            const pushPayload = context.payload;
            const commits = pushPayload.commits || [];

            // Process each commit to find and close issues
            const processedIssues = new Set();

            for (const commit of commits) {
              const message = commit.message;
              
              // Regex to match GitHub keywords: Fixes #123, Closes #123, Resolves #123, etc.
              // Also matches: fix(#123), closes(#123), #123, etc.
              const issueRegex = /(?:fixes?|closes?|resolves?|fix|close|resolve)\s*\(?#(\d+)\)?|#(\d+)/gi;
              const matches = message.matchAll(issueRegex);
              
              for (const match of matches) {
                const issueNum = match[1] || match[2]; // match[1] for keyword format, match[2] for #123 format
                if (!issueNum || processedIssues.has(issueNum)) continue;
                
                processedIssues.add(issueNum);
                
                try {
                  // Check if issue exists and is open
                  const issue = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNum
                  });
                  
                  if (issue.data.state === 'open') {
                    console.log(`Cerrando issue #${issueNum} mencionado en commit: ${commit.id.substring(0, 7)}`);
                    
                    // Close the issue with a comment
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNum,
                      body: `Cerrado automáticamente por commit: ${commit.id.substring(0, 7)} - ${commit.message.split('\n')[0]}`
                    });
                    
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNum,
                      state: 'closed'
                    });
                    
                    console.log(`✅ Cerrado issue #${issueNum}`);
                    
                    // Now move to Done in project
                    const issueNodeId = issue.data.node_id;
                    
                    // Find the item in the project associated with this issue
                    const issueQuery = `
                      query($id: ID!) {
                        node(id: $id) {
                          ... on Issue {
                            projectItems(first: 10) {
                              nodes {
                                id
                                project {
                                  id
                                }
                              }
                            }
                          }
                        }
                      }
                    `;
                    
                    const issueData = await github.graphql(issueQuery, { id: issueNodeId });
                    const projectItem = issueData.node.projectItems.nodes.find(item => item.project.id === projectId);
                    
                    let itemId;
                    
                    if (!projectItem) {
                      console.log(`Issue #${issueNum} no está en el proyecto. Agregándolo...`);
                      const addQuery = `
                        mutation($projectId: ID!, $contentId: ID!) {
                          addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                            item {
                              id
                            }
                          }
                        }
                      `;
                      const addData = await github.graphql(addQuery, { projectId: projectId, contentId: issueNodeId });
                      itemId = addData.addProjectV2ItemById.item.id;
                    } else {
                      itemId = projectItem.id;
                    }

                    // Update the status to Done
                    console.log(`Moviendo issue #${issueNum} a Done en el proyecto`);
                    const updateQuery = `
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { singleSelectOptionId: $value }
                        }) {
                          projectV2Item {
                            id
                          }
                        }
                      }
                    `;
                    
                    await github.graphql(updateQuery, {
                      projectId: projectId,
                      itemId: itemId,
                      fieldId: statusField.id,
                      value: doneOption.id
                    });
                    
                    console.log(`✅ Issue #${issueNum} movido a Done`);
                  } else {
                    console.log(`Issue #${issueNum} ya está cerrado.`);
                  }
                } catch (error) {
                  console.log(`⚠️ No se pudo procesar issue #${issueNum}: ${error.message}`);
                }
              }
            }

            if (processedIssues.size === 0) {
              console.log('No se encontraron referencias a issues en los commits.');
            } else {
              console.log(`Procesados ${processedIssues.size} issue(s) en total.`);
            }
